<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 天空漸變背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- 太陽漸變 -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- 白雲漸變 -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- 愛心漸變 -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- 柔和陰影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>

    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon 圓角底圖 -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- 太陽光芒暈影 -->
  <circle cx="210" cy="195" r="115" fill="#fef08a" opacity="0.25"/>

  <!-- 太陽 -->
  <circle cx="210" cy="195" r="85" fill="url(#sunGrad)" filter="url(#sunGlow)"/>

  <!-- 立體白雲 -->
  <g filter="url(#shadow)">
    <path d="M 175 365 
             L 345 365 
             A 50 50 0 0 0 385 280 
             A 45 45 0 0 0 345 225 
             A 65 65 0 0 0 225 205 
             A 60 60 0 0 0 140 275 
             A 50 50 0 0 0 175 365 Z" 
          fill="url(#cloudGrad)"/>
  </g>

  <!-- 關心愛心標誌 -->
  <g filter="url(#shadow)" transform="translate(325, 305) scale(1.15)">
    <path d="M 12 21.35 l -1.45 -1.32 C 5.4 15.36 2 12.28 2 8.5 C 2 5.42 4.42 3 7.5 3 c 1.74 0 3.41 0.81 4.5 2.09 C 13.09 3.81 14.76 3 16.5 3 C 19.58 3 22 5.42 22 8.5 c 0 3.78 -3.4 6.86 -8.55 11.54 L 12 21.35 Z" 
          fill="url(#heartGrad)"/>
  </g>
</svg>
